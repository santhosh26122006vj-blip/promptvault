<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard – PromptVault</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="dashboard-body">

  <!-- Top Navbar -->
  <header class="navbar">
    <button id="sidebarToggle" class="icon-btn" aria-label="Toggle sidebar">☰</button>
    <h2 class="navbar-title">PromptVault</h2>
    <div class="navbar-right">
      <button id="profileBtn" class="icon-btn" title="Profile">👤</button>
      <button id="logoutBtn" class="btn-secondary small">Logout</button>
    </div>
  </header>

  <div class="dashboard-layout">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-heading-row">
        <h3 class="sidebar-heading">Categories</h3>
        <button id="addCategoryBtn" class="category-add-btn" type="button" title="Add category" aria-label="Add category">+</button>
      </div>
      <ul class="category-list" id="categoryList">
        <!-- Categories are loaded from the signed-in user's Firestore data. -->
      </ul>
    </aside>

    <!-- Main content -->
    <main class="main-content">

      <!-- Welcome + stats -->
      <section class="welcome-section">
        <div>
          <h1 id="welcomeMessage" class="welcome-title">Welcome back!</h1>
          <p class="welcome-sub">Here is your prompt library</p>
        </div>
        <div class="stat-card">
          <span class="stat-number" id="totalPromptCount">0</span>
          <span class="stat-label">Total Prompts</span>
        </div>
      </section>

      <!-- Search + Add -->
      <section class="toolbar">
        <input type="text" id="searchInput" class="search-input" placeholder="Search prompts by title, tag, or content..." />
        <button id="addPromptBtn" class="btn-primary">+ Add Prompt</button>
      </section>

      <!-- Prompt grid -->
      <section id="promptGrid" class="prompt-grid">
        <!-- Prompt cards injected by app.js -->
      </section>

      <p id="emptyState" class="empty-state hidden">No prompts found. Try a different search or add a new prompt.</p>

    </main>
  </div>

  <!-- ADD / EDIT PROMPT MODAL -->
  <div id="promptModal" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="promptModalTitle">Add Prompt</h3>
        <button class="icon-btn" id="closePromptModal">✕</button>
      </div>
      <form id="promptForm">
        <input type="hidden" id="promptId" />

        <label for="promptTitle">Title</label>
        <input type="text" id="promptTitle" placeholder="Prompt title" required />

        <label for="promptContent">Prompt Content</label>
        <textarea id="promptContent" rows="5" placeholder="Write your prompt here..." required></textarea>

        <label for="promptCategory">Category</label>
        <select id="promptCategory" required>
          <!-- Options are populated from the user's categories in app.js. -->
        </select>

        <label for="promptTags">Tags (comma separated)</label>
        <input type="text" id="promptTags" placeholder="e.g. seo, blog, tips" />

        <label for="promptAiModel">AI Model</label>
        <input type="text" id="promptAiModel" placeholder="e.g. ChatGPT, Gemini, Claude" />

        <button type="submit" class="btn-primary full-width">Save Prompt</button>
      </form>
    </div>
  </div>

  <!-- ADD / RENAME CATEGORY MODAL -->
  <div id="categoryModal" class="modal-overlay hidden">
    <div class="modal-box category-modal-box">
      <div class="modal-header">
        <h3 id="categoryModalTitle">Add Category</h3>
        <button class="icon-btn" id="closeCategoryModal" type="button">✕</button>
      </div>
      <form id="categoryForm">
        <input type="hidden" id="categoryId" />
        <label for="categoryName">Category Name</label>
        <input type="text" id="categoryName" maxlength="50" placeholder="e.g. Prompt Engineering" required />
        <button type="submit" class="btn-primary full-width">Save Category</button>
      </form>
    </div>
  </div>

  <!-- VIEW PROMPT MODAL -->
  <div id="viewModal" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="viewPromptTitle">Prompt Title</h3>
        <button class="icon-btn" id="closeViewModal">✕</button>
      </div>
      <p class="view-meta">
        <span id="viewPromptCategory" class="badge"></span>
        <span id="viewPromptModel" class="badge badge-outline"></span>
      </p>
      <div class="view-content-box">
        <p id="viewPromptContent"></p>
      </div>
      <p class="view-tags" id="viewPromptTags"></p>
      <p class="view-date" id="viewPromptDate"></p>
      <button class="btn-primary full-width" id="copyFromViewBtn">Copy Prompt</button>
    </div>
  </div>

  <!-- PROFILE MODAL -->
  <div id="profileModal" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h3>My Profile</h3>
        <button class="icon-btn" id="closeProfileModal">✕</button>
      </div>
      <form id="profileForm">
        <div class="profile-pic-row">
          <img id="profilePicPreview" src="https://via.placeholder.com/80x80.png?text=User" alt="Profile picture" class="profile-pic" />
          <input type="file" id="profilePicInput" accept="image/*" />
        </div>

        <label for="profileName">Full Name</label>
        <input type="text" id="profileName" required />

        <label for="profileEmail">Email</label>
        <input type="email" id="profileEmail" disabled />

        <label for="profileNewPassword">New Password (optional)</label>
        <input type="password" id="profileNewPassword" placeholder="Leave blank to keep current password" minlength="6" />

        <button type="submit" class="btn-primary full-width">Save Changes</button>
      </form>
    </div>
  </div>

  <!-- Toast notification -->
  <div id="toast" class="toast hidden"></div>

  <!-- Firebase SDK + App logic -->
  <script type="module" src="firebase.js"></script>
  <script type="module" src="app.js"></script>

  <!-- Sidebar toggle for mobile (UI-only, no Firebase logic) -->
  <script>
    document.getElementById('sidebarToggle').addEventListener('click', () => {
      document.getElementById('sidebar').classList.toggle('sidebar-open');
    });
  </script>

</body>
</html>
